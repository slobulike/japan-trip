<meta name="apple-mobile-web-app-title" content="Trip">
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#faf7f2;color:#1e293b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
input,select,textarea{font-size:16px!important}.bg-rose-600{color:#fff}
.chips::-webkit-scrollbar{display:none}.chips{scrollbar-width:none}
body.noscroll{overflow:hidden}
</style></head>
<body>
<div id="app" class="max-w-xl mx-auto min-h-screen pb-28"></div>
<div id="sheet"></div>
<input type="file" id="imp" accept=".json,application/json,text/plain" class="hidden" onchange="importFile(event)">
<script>
let DAYS_CONFIG=[],BUDGET={total:0,days:1,lines:[]},SALLY={},META={title:'Family Trip Planner',sub:''};
const STORE_KEY='trip_planner_v1';
const fmtGBP=n=>(n<0?'-':'')+'£'+Math.abs(Math.round(n)).toLocaleString('en-GB');
const $=id=>document.getElementById(id);
const h=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const CAT={Music:'🎵',Sports:'⚾',Culture:'⛩️',Kids:'🎢',Food:'🍜',Shopping:'🛍️',Travel:'🚆'};
const PAL=['rose','emerald','amber','sky','violet'];const tripDates=()=>{const f=d=>d.dateStr.split(' ').slice(1).join(' ');return DAYS_CONFIG.length?f(DAYS_CONFIG[0])+' – '+f(DAYS_CONFIG[DAYS_CONFIG.length-1]):''};
const mapUrl=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
function dayRoute(n){const d=dayOf(n),prev=DAYS_CONFIG.find(x=>x.dayNum==n-1),start=(prev&&prev.place)||d.place;const ps=[start].concat(SLOTS.flatMap(([k])=>acts.filter(a=>a.day==n&&a.slot===k).map(a=>a.place))).filter(Boolean).filter((p,i,r)=>p!==r[i-1]);return ps.length>1?'https://www.google.com/maps/dir/'+ps.map(encodeURIComponent).join('/'):''}
function mapBtn(n){const u=dayRoute(n);return u?`<a href="${u}" target="_blank" rel="noopener" class="block text-center py-2.5 rounded-xl border border-slate-300 bg-white text-sm font-semibold text-sky-700">🗺️ See this day on Google Maps</a>`:''}
const dayOf=n=>DAYS_CONFIG.find(d=>d.dayNum==n)||DAYS_CONFIG[0];const dlabel=d=>d.label||'Day '+d.dayNum;const dayName=n=>{const d=dayOf(n);return d?dlabel(d):''};
const cityCol=c=>{if(c==='London')return'indigo';const l=[...new Set(DAYS_CONFIG.map(d=>d.city).filter(x=>x!=='London'))];return PAL[Math.max(0,l.indexOf(c))%PAL.length]};
const SLOTS=[['morning','🌅 Morning'],['afternoon','☀️ Afternoon'],['evening','🌙 Evening']];
let acts=[],ui={tab:'plan',day:1,filter:'All',sheet:null};
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify({meta:META,days:DAYS_CONFIG,budget:BUDGET,notes:SALLY,activities:acts}))}catch(e){}}
function apply(p){META=p.meta||META;DAYS_CONFIG=p.days;BUDGET=p.budget||BUDGET;SALLY=p.notes||{};acts=p.activities;ui.day=p.days[0].dayNum;ui.tab='plan'}
function load(){try{const v=JSON.parse(localStorage.getItem(STORE_KEY)||'null');if(v&&Array.isArray(v.days))apply(v)}catch(e){}}
const find=id=>acts.find(a=>a.id===id);
function budget(){const committed=BUDGET.lines.reduce((s,l)=>s+l[1],0);const left=BUDGET.total-committed;const planned=acts.filter(a=>a.day!=='car-park').reduce((s,a)=>s+(Number(a.cost)||0),0);return{committed,left,planned,spare:left-planned}}

// ---------- views
function header(){const b=budget();
 return `<div class="sticky top-0 z-20 bg-[#faf7f2]/95 backdrop-blur border-b border-slate-200" style="padding-top:env(safe-area-inset-top)">
 <div class="flex items-center justify-between px-4 py-2.5"><div class="font-extrabold text-base">${h(META.title)}</div><span class="text-xs font-semibold text-slate-500">${tripDates()}</span></div>
 ${ui.tab==='plan'?chips():''}</div>`}
function chips(){return `<div class="chips flex gap-2 overflow-x-auto px-4 pb-3">`+DAYS_CONFIG.map(d=>{const on=d.dayNum===ui.day,c=cityCol(d.city),p=d.dateStr.split(' ');
 return `<button id="chip${d.dayNum}" onclick="setDay(${d.dayNum})" class="shrink-0 w-[66px] py-1.5 rounded-2xl border text-center ${on?`bg-${c}-500/20 border-${c}-400 text-slate-900`:'border-slate-200 bg-white text-slate-500'}"><span class="block text-[10px] uppercase">${dlabel(d)}</span><span class="block text-sm font-bold">${p[1]} ${p[2]}</span><span class="block text-[10px]">${p[0]}</span></button>`}).join('')+`</div>`}
function card(a){const tag=(t,cl)=>`<span class="px-2 py-0.5 rounded-full ${cl}">${t}</span>`;
 return `<button onclick="openSheet('edit','${a.id}')" class="w-full text-left flex gap-3 p-3 rounded-2xl border ${a.locked?'border-amber-500/40 bg-amber-500/5':'border-slate-200 bg-white shadow-sm'} active:bg-slate-100">
 <span class="text-xl leading-none mt-0.5">${CAT[a.category]||'•'}</span><span class="flex-1 min-w-0"><span class="block font-bold text-sm">${h(a.title)}</span>
 ${a.desc?`<span class="block text-xs text-slate-500 mt-0.5 line-clamp-2">${h(a.desc)}</span>`:''}
 <span class="flex flex-wrap gap-1.5 mt-1.5 text-[11px]">${a.locked?tag('🔒 Locked in','bg-amber-500/15 text-amber-700'):''}${a.booked?tag('✅ Booked','bg-emerald-500/15 text-emerald-700'):a.book?tag('📌 To book','bg-amber-500/10 text-amber-700'):''}${a.cost!=null?tag(fmtGBP(a.cost),'bg-slate-100 text-slate-600'):''}${a.note?tag('💬','bg-slate-100 text-slate-600'):''}${ui.tab==='ideas'?tag('📍 '+a.location,'bg-slate-100 text-slate-600'):''}</span></span></button>`}
function planHtml(){const d=dayOf(ui.day),c=cityCol(d.city);
 const ordered=SLOTS.flatMap(([k])=>acts.filter(a=>a.day==ui.day&&a.slot===k));let last='';
 const dot=cl=>`<span class="absolute -left-[23px] top-4 w-3 h-3 rounded-full ${cl}"></span>`;
 const sections=`<div class="ml-1.5 pl-4 border-l-2 border-slate-200 space-y-2">`+(ordered.length?ordered.map(a=>{const first=a.slot!==last;last=a.slot;const lab=SLOTS.find(x=>x[0]===a.slot)[1];
  return (first?`<div class="text-[11px] font-bold uppercase tracking-wider text-slate-400 pt-2">${lab}</div>`:'')+`<div class="relative">${dot('bg-'+c+'-500 ring-4 ring-[#faf7f2]')}${card(a)}</div>`}).join(''):'<p class="text-sm text-slate-500 py-3">Nothing planned for this day yet.</p>')+
  `<div class="relative">${dot('bg-white border-2 border-slate-300')}<button onclick="openSheet('pick',null,${ui.day},'${ordered.length?ordered[ordered.length-1].slot:'morning'}')" class="w-full py-3 rounded-2xl border border-dashed border-slate-300 text-sm text-slate-500 bg-white/60">＋ Add to this day</button></div></div>`;
 return `<div class="px-4 pt-4 space-y-5"><div class="rounded-2xl border border-${c}-500/30 bg-${c}-500/10 p-3.5"><div class="flex justify-between items-center"><div class="font-extrabold text-lg">${d.dateStr}</div><span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-${c}-500/20 text-${c}-700">${d.city}</span></div>
 <div class="text-xs text-slate-600 mt-1">${d.icon||'🏨'} ${h(d.hotel)}</div><div class="text-xs text-slate-500">${h(d.notes)}</div>
 ${SALLY[d.dayNum]?`<details class="mt-2 text-xs"><summary class="cursor-pointer text-amber-700 font-semibold">💬 Sally's note from the spreadsheet</summary><p class="mt-1.5 text-slate-600 leading-relaxed">${h(SALLY[d.dayNum])}</p></details>`:''}</div>
 ${mapBtn(ui.day)}${sections}
 ${navBtns(d)}</div>`}
function navBtns(d){const i=DAYS_CONFIG.indexOf(d),p=DAYS_CONFIG[i-1],n=DAYS_CONFIG[i+1],b=(x,t)=>x?`<button onclick="setDay(${x.dayNum})" class="px-4 py-2.5 rounded-xl bg-white border border-slate-200">${t}</button>`:'<span></span>';return `<div class="flex justify-between pt-2 text-sm">${b(p,'‹ '+(p?dlabel(p):''))}${b(n,(n?dlabel(n):'')+' ›')}</div>`}
function ideasHtml(){const f=ui.filter,items=acts.filter(a=>a.day==='car-park'&&(f==='All'||a.location===f));
 return `<div class="px-4 pt-4 space-y-3"><p class="text-xs text-slate-500">Ideas not on a day yet. Tap one to put it on a day.</p>
 <div class="chips flex gap-2 overflow-x-auto">${['All',...new Set(acts.map(a=>a.location))].map(x=>`<button onclick="ui.filter='${x}';render()" class="shrink-0 px-3.5 py-1.5 rounded-full text-xs font-semibold border ${f===x?'bg-rose-500/20 border-rose-400 text-slate-900':'border-slate-200 text-slate-500'}">${x}</button>`).join('')}</div>
 <div class="space-y-2">${items.map(card).join('')||'<p class="text-sm text-slate-400 py-6 text-center">Nothing here.</p>'}</div>
 <button onclick="openSheet('new',null,'car-park','main')" class="w-full py-3 rounded-2xl bg-rose-600 font-semibold text-sm">＋ New idea</button></div>`}
function bookHtml(){const today=new Date();today.setHours(0,0,0,0);
 const items=acts.filter(a=>a.book).sort((x,y)=>(x.booked?1:0)-(y.booked?1:0)||(x.bookBy||'9999').localeCompare(y.bookBy||'9999'));
 return `<div class="px-4 pt-4 space-y-2"><p class="text-xs text-slate-500 mb-1">Everything with a booking window, soonest first. Tick when done.</p>`+items.map(a=>{let when='Date depends on which day you choose';
  if(a.bookBy){const d=new Date(a.bookBy+'T12:00:00'),n=Math.round((d-today)/864e5);when=d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})+(n<0?' · passed':` · in ${n} days`)}
  const s=a.day==='car-park'?'Not on a day yet':`${dayName(a.day)} ${a.slot}`;
  return `<div class="flex gap-3 p-3 rounded-2xl border ${a.booked?'border-emerald-300 opacity-60':'border-slate-200 bg-white shadow-sm'}"><input type="checkbox" class="mt-1 w-5 h-5" ${a.booked?'checked':''} onchange="toggleBooked('${a.id}')">
  <button onclick="openSheet('edit','${a.id}')" class="text-left text-xs flex-1"><span class="block font-bold text-sm">${h(a.title)}</span><span class="block text-amber-700">${h(a.book)}</span><span class="block text-slate-500">${when} · ${s}</span></button></div>`}).join('')+`</div>`}
function tripHtml(){const b=budget();
 const days=DAYS_CONFIG.map(d=>{const t=acts.filter(a=>a.day==d.dayNum).map(a=>a.title).join(' · ');return `<button onclick="setDay(${d.dayNum});go('plan')" class="w-full text-left p-3 rounded-xl bg-white shadow-sm border border-slate-200"><span class="block text-xs font-bold">${dlabel(d)} · ${d.dateStr} · ${d.city}</span><span class="block text-[11px] text-slate-500 mt-0.5">${h(t)||'Nothing planned'}</span></button>`}).join('');
 const row=(l,v,c='text-slate-900')=>`<div class="flex justify-between text-sm py-1"><span class="text-slate-500">${l}</span><b class="${c}">${v}</b></div>`;
 return `<div class="px-4 pt-4 space-y-5">
 <div class="rounded-2xl border border-slate-200 bg-white shadow-sm p-4"><div class="font-bold mb-1">💷 Budget</div>${row('Total budget',fmtGBP(BUDGET.total))}${row('Flights & hotels (booked)',fmtGBP(b.committed))}${row('Left for the trip',fmtGBP(b.left)+` (≈ ${fmtGBP(b.left/BUDGET.days)}/day)`)}${row('Activities pencilled in',fmtGBP(b.planned))}${row('Left for food, transport & shopping',fmtGBP(b.spare),b.spare<0?'text-rose-600':'text-emerald-600')}
 <p class="text-[11px] text-slate-400 mt-2">Activity costs are rough family estimates you can edit on each card. Only activities placed on a day count.</p></div>
 <div class="rounded-2xl border border-slate-200 bg-white shadow-sm p-4 space-y-2"><div class="font-bold">🔄 Share between us</div>
 <button onclick="openSheet('export')" class="w-full py-3 rounded-xl bg-rose-600 font-semibold text-sm">Export Itinerary for Rich</button>
 <button onclick="openSheet('import')" class="w-full py-3 rounded-xl bg-slate-100 border border-slate-300 font-semibold text-sm">Import Rich's Itinerary</button>
 <button onclick="copySummary()" class="w-full py-2.5 rounded-xl text-xs text-slate-500">Copy plan as text (WhatsApp)</button></div>
 <div><div class="font-bold mb-2">🗺️ Whole trip</div><div class="space-y-2">${days}</div></div>
 <button onclick="resetAll()" class="w-full py-2 text-xs text-slate-400">Clear itinerary from this device</button></div>`}
function welcome(){return `<div class="min-h-screen flex flex-col items-center justify-center text-center px-8 space-y-4"><div class="text-5xl">🗓️</div><h1 class="text-xl font-extrabold">Family Trip Planner</h1><p class="text-sm text-slate-500">Nothing here yet. Save the itinerary file you were sent, then tap the button and choose it.</p><button onclick="$('imp').click()" class="px-6 py-3 rounded-xl bg-rose-600 font-semibold text-sm">Import Rich's Itinerary</button></div>`}
function render(){
 if(!DAYS_CONFIG.length){$('app').innerHTML=welcome();return}
 const body={plan:planHtml,ideas:ideasHtml,book:bookHtml,trip:tripHtml}[ui.tab]();
 const tabs=[['plan','🗓️','Plan'],['ideas','💡','Ideas'],['book','📌','Book'],['trip','⚙️','Trip']];
 $('app').innerHTML=header()+body+`<nav class="fixed bottom-0 inset-x-0 z-30 bg-white/95 backdrop-blur border-t border-slate-200" style="padding-bottom:env(safe-area-inset-bottom)"><div class="max-w-xl mx-auto grid grid-cols-4">${tabs.map(([k,e,l])=>`<button onclick="go('${k}')" class="py-2.5 text-center ${ui.tab===k?'text-rose-600':'text-slate-400'}"><span class="block text-lg leading-none">${e}</span><span class="block text-[11px] font-semibold mt-0.5">${l}${k==='ideas'?' ('+acts.filter(a=>a.day==='car-park').length+')':''}</span></button>`).join('')}</div></nav>`;
 const c=$('chip'+ui.day);if(c&&ui.tab==='plan')c.scrollIntoView({inline:'center',block:'nearest'});
}
function go(t){ui.tab=t;window.scrollTo(0,0);render()}
function setDay(n){ui.day=n;if(ui.tab!=='plan')ui.tab='plan';window.scrollTo(0,0);render()}

// ---------- sheets
function openSheet(type,id,day,slot){ui.sheet={type,id,day,slot};renderSheet()}
function closeSheet(){ui.sheet=null;renderSheet();render()}
function renderSheet(){const s=ui.sheet,el=$('sheet');document.body.classList.toggle('noscroll',!!s);
 if(!s){el.innerHTML='';return}
 let inner='';
 if(s.type==='edit')inner=editSheet(find(s.id));
 if(s.type==='pick')inner=pickSheet(s);
 if(s.type==='new')inner=newSheet(s);
 if(s.type==='export')inner=exportSheet();
 if(s.type==='import')inner=importSheet();
 el.innerHTML=`<div class="fixed inset-0 z-50 flex items-end justify-center bg-slate-900/40" onclick="if(event.target===this)closeSheet()"><div class="w-full max-w-xl max-h-[90vh] overflow-y-auto bg-white border-t border-slate-300 rounded-t-3xl p-5 space-y-4" style="padding-bottom:calc(1.25rem + env(safe-area-inset-bottom))"><div class="mx-auto w-10 h-1 rounded-full bg-slate-300 -mt-2"></div>${inner}<button onclick="closeSheet()" class="w-full py-3 rounded-xl bg-slate-100 text-sm font-semibold">Close</button></div></div>`}
const sel='w-full bg-white border border-slate-300 rounded-xl px-3 py-3 text-slate-900';
function editSheet(a){if(!a)return'';
 const links=(a.links||[]).map(l=>`<a href="${l.url}" target="_blank" rel="noopener" class="inline-block px-3 py-2 rounded-xl bg-slate-100 text-sky-700 text-sm">${h(l.label)} ↗</a>`).join(' ')+(a.place?` <a href="${mapUrl(a.place)}" target="_blank" rel="noopener" class="inline-block px-3 py-2 rounded-xl bg-slate-100 text-sky-700 text-sm">📍 Map ↗</a>`:'');
 const dayOpts=`<option value="car-park" ${a.day==='car-park'?'selected':''}>💡 Back to Ideas</option>`+DAYS_CONFIG.map(d=>`<option value="${d.dayNum}" ${a.day==d.dayNum?'selected':''}>${dlabel(d)} · ${d.dateStr} · ${d.city}</option>`).join('');
 const slotOpts=SLOTS.map(([k,l])=>`<option value="${k}" ${a.slot===k?'selected':''}>${l}</option>`).join('');
 const ed=ui.sheet&&ui.sheet.edit,fld=(k,ex)=>`oninput="setField('${a.id}','${k}',${ex||'this.value'})"`;
 const form=`<div class="space-y-2"><input value="${h(a.title)}" ${fld('title')} class="${sel} font-bold" placeholder="Title">
 <textarea rows="3" ${fld('desc')} class="${sel}" placeholder="Details">${h(a.desc||'')}</textarea>
 <div class="grid grid-cols-2 gap-2"><select onchange="setField('${a.id}','category',this.value)" class="${sel}">${Object.keys(CAT).map(k=>`<option ${a.category===k?'selected':''}>${k}</option>`).join('')}</select><input value="${h(a.location)}" list="locs" ${fld('location')} class="${sel}" placeholder="City"></div>
 <datalist id="locs">${[...new Set(acts.map(x=>x.location))].map(l=>`<option value="${h(l)}">`).join('')}</datalist>
 <div class="text-xs text-slate-500 pt-1">Booking info (appears on the Book tab; clear it to remove)</div>
 <textarea rows="2" ${fld('book','this.value.trim()?this.value:undefined')} class="${sel}" placeholder="e.g. Tickets on sale 11am Sat 13 Mar">${h(a.book||'')}</textarea>
 <label class="text-xs text-slate-500">Book by date (optional)</label><input type="date" value="${a.bookBy||''}" ${fld('bookBy','this.value||undefined')} class="${sel}">
 <button onclick="ui.sheet.edit=false;render();renderSheet()" class="w-full py-3 rounded-xl bg-rose-600 font-semibold text-sm">Done editing</button></div>`;
 if(ed)return form;
 return `<div><div class="flex justify-between items-start gap-2"><div class="text-xs text-slate-500">${CAT[a.category]||''} ${a.category} · 📍 ${a.location}</div><button onclick="ui.sheet.edit=true;renderSheet()" class="text-xs font-semibold text-sky-700 shrink-0">✏️ Edit details</button></div><h3 class="text-lg font-extrabold leading-snug">${h(a.title)}</h3>${a.desc?`<p class="text-sm text-slate-600 mt-1">${h(a.desc)}</p>`:''}</div>
 ${links?`<div class="flex flex-wrap gap-2">${links}</div>`:''}
 ${a.book?`<div class="rounded-xl bg-amber-500/10 border border-amber-500/30 p-3 text-sm"><div class="text-amber-700">📌 ${h(a.book)}</div><label class="flex items-center gap-2 mt-2"><input type="checkbox" class="w-5 h-5" ${a.booked?'checked':''} onchange="toggleBooked('${a.id}',true)"> We've booked this</label></div>`:''}
 <div class="rounded-xl border ${a.locked?'border-amber-500/50 bg-amber-500/5':'border-slate-200'} p-3 space-y-2"><label class="flex items-center justify-between font-semibold text-sm"><span>🔒 Lock in <span class="font-normal text-slate-500">(decided, can't be moved)</span></span><input type="checkbox" class="w-6 h-6" ${a.locked?'checked':''} onchange="toggleLock('${a.id}')"></label>
 <textarea rows="2" oninput="setField('${a.id}','note',this.value)" placeholder="Add a comment, e.g. why we chose this" class="${sel}">${h(a.note||'')}</textarea></div>
 <div><label class="text-xs text-slate-500">Estimated cost for all of us (£)</label><input type="number" inputmode="decimal" min="0" value="${a.cost==null?'':a.cost}" oninput="setField('${a.id}','cost',this.value===''?undefined:Math.max(0,Number(this.value)))" class="${sel} mt-1" placeholder="e.g. 120">${a.priceNote?`<p class="text-[11px] text-slate-400 mt-1">${h(a.priceNote)}</p>`:''}</div>
 ${a.locked?'<p class="text-xs text-amber-700">Unlock to move or remove this.</p>':`<div class="space-y-2"><div class="text-xs text-slate-500">Move to</div><select id="mv-day" class="${sel}">${dayOpts}</select><select id="mv-slot" class="${sel}">${slotOpts}</select>
 <button onclick="moveTo('${a.id}')" class="w-full py-3 rounded-xl bg-rose-600 font-semibold text-sm">Move</button><button onclick="removeAct('${a.id}')" class="w-full py-2 text-xs text-rose-600">Remove this idea</button></div>`}`}
function pickSheet(s){const d=dayOf(s.day),items=acts.filter(a=>a.day==='car-park');
 return `<div><h3 class="text-lg font-extrabold">Add to ${d.dateStr}</h3><div class="flex gap-2 pt-2">${SLOTS.map(([k,l])=>`<button onclick="ui.sheet.slot='${k}';renderSheet()" class="flex-1 py-2 rounded-xl text-xs font-semibold border ${s.slot===k?'bg-rose-100 border-rose-400 text-slate-900':'border-slate-300 text-slate-500'}">${l}</button>`).join('')}</div><p class="text-xs text-slate-500 pt-1">Pick the time of day, then tap an idea to add it.</p></div><div class="space-y-2">${items.map(a=>`<button onclick="assign('${a.id}',${s.day},'${s.slot}')" class="w-full text-left p-3 rounded-xl bg-slate-100 text-sm"><b>${CAT[a.category]||''} ${h(a.title)}</b><span class="block text-[11px] text-slate-500">📍 ${a.location}${a.book?' · 📌 needs booking':''}</span></button>`).join('')||'<p class="text-sm text-slate-400">No spare ideas, add a new one below.</p>'}</div>
 <button onclick="openSheet('new',null,${s.day},'${s.slot}')" class="w-full py-3 rounded-xl bg-rose-600 font-semibold text-sm">＋ Write a new idea for this slot</button>`}
function newSheet(s){const opt=a=>a.map(x=>`<option>${x}</option>`).join('');
 return `<h3 class="text-lg font-extrabold">New idea</h3><input id="n-title" placeholder="What is it?" class="${sel}"><div class="grid grid-cols-2 gap-2"><select id="n-cat" class="${sel}">${opt(Object.keys(CAT))}</select><select id="n-loc" class="${sel}">${opt([...new Set(acts.map(a=>a.location))])}</select></div><textarea id="n-desc" rows="2" placeholder="Notes (optional)" class="${sel}"></textarea>
 <button onclick="createIdea(${JSON.stringify(s.day).replace(/"/g,"'")},'${s.slot}')" class="w-full py-3 rounded-xl bg-rose-600 font-semibold text-sm">Save</button>`}
function exportSheet(){return `<h3 class="text-lg font-extrabold">Export Itinerary for Rich</h3>
 <ol class="text-sm text-slate-600 space-y-2 list-decimal pl-5"><li>Tap <b>Share / save file</b> below.</li><li>Choose <b>Mail</b> (or Messages / WhatsApp) and send it to Rich. If your phone just saves it instead, find it in <b>Files › Downloads</b> and attach it to an email to Rich.</li><li>Rich opens it with <b>Import Rich's Itinerary</b> and sees all your changes, locks and comments.</li></ol>
 <button onclick="doExport()" class="w-full py-3 rounded-xl bg-rose-600 font-semibold text-sm">Share / save file</button>`}
function importSheet(){return `<h3 class="text-lg font-extrabold">Import Rich's Itinerary</h3>
 <ol class="text-sm text-slate-600 space-y-2 list-decimal pl-5"><li>Save the itinerary file Rich (or Sally) sent you.</li><li>Tap <b>Choose file</b> and pick it.</li></ol><p class="text-xs text-amber-700">This replaces the plan on this device, so export yours first if you have changes to keep.</p>
 <button onclick="$('imp').click()" class="w-full py-3 rounded-xl bg-rose-600 font-semibold text-sm">Choose file</button>`}

// ---------- actions
function setField(id,k,v){const a=find(id);if(a){a[k]=v;save()}}
function toggleBooked(id,keep){const a=find(id);if(a){a.booked=!a.booked;save();render();if(keep)renderSheet()}}
function toggleLock(id){const a=find(id);if(a){a.locked=!a.locked;save();render();renderSheet()}}
function moveTo(id){const a=find(id),d=$('mv-day').value,s=$('mv-slot').value;if(!a||a.locked)return;a.day=d==='car-park'?'car-park':parseInt(d);a.slot=d==='car-park'?'main':s;save();if(a.day!=='car-park'){ui.day=a.day;ui.tab='plan'}ui.sheet=null;renderSheet();render()}
function assign(id,day,slot){const a=find(id);if(a){a.day=day;a.slot=slot;save()}ui.sheet=null;renderSheet();render()}
function removeAct(id){const a=find(id);if(a&&!a.locked&&confirm('Remove "'+a.title+'"?')){acts=acts.filter(x=>x.id!==id);save();closeSheet();render()}}
function createIdea(day,slot){const t=$('n-title').value.trim();if(!t)return;acts.push({id:'c-'+Date.now(),title:t,category:$('n-cat').value,location:$('n-loc').value,desc:$('n-desc').value.trim(),day,slot});save();ui.sheet=null;renderSheet();render()}
function resetAll(){if(confirm('Clear the itinerary from this device? You can import the file again afterwards.')){try{localStorage.removeItem(STORE_KEY)}catch(e){}DAYS_CONFIG=[];acts=[];render()}}
async function doExport(){
 const data=JSON.stringify({app:'tripplanner',version:4,exported:new Date().toISOString(),meta:META,days:DAYS_CONFIG,budget:BUDGET,notes:SALLY,activities:acts},null,2),name='trip_itinerary_'+new Date().toISOString().slice(0,10)+'.json';
 try{const f=new File([data],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Trip itinerary',text:'Latest itinerary for Rich'});return}}catch(e){if(e&&e.name==='AbortError')return}
 const u=URL.createObjectURL(new Blob([data],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
}
function importFile(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const p=JSON.parse(r.result);if(!Array.isArray(p.activities)||!Array.isArray(p.days))throw 0;if(DAYS_CONFIG.length&&!confirm('Replace the itinerary on this device with the one in this file?'))return;apply(p);save();ui.sheet=null;renderSheet();render();alert('Itinerary updated.')}catch(e){alert("That file doesn't look like an itinerary export.")}};r.readAsText(f);ev.target.value=''}
function copySummary(){let t='🌸 '+META.title+'\n'+tripDates()+'\n\n';
 DAYS_CONFIG.forEach(d=>{t+=`${dlabel(d).toUpperCase()}: ${d.dateStr} (${d.city}) · ${d.hotel}\n`;SLOTS.forEach(([k,l])=>acts.filter(a=>a.day==d.dayNum&&a.slot===k).forEach(a=>{t+=`  ${l.slice(3)}: ${a.title}${a.locked?' 🔒':''}${a.book&&!a.booked?' [TO BOOK: '+a.book+']':''}${a.note?' — '+a.note:''}\n`}));t+='\n'});
 const x=acts.filter(a=>a.day==='car-park');if(x.length)t+='IDEAS: '+x.map(a=>a.title).join('; ')+'\n';
 const ok=()=>alert('Copied. Paste it into WhatsApp or email.');
 if(navigator.clipboard)navigator.clipboard.writeText(t).then(ok).catch(()=>alert('Could not copy.'));else{const e=document.createElement('textarea');e.value=t;document.body.appendChild(e);e.select();document.execCommand('copy');e.remove();ok()}}
load();render();
</script></body></html>
